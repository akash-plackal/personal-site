<body>
  <include src="src/partials/site-header.html"></include>

  <main>
    <header class="page-hero">
      <p class="eyebrow">Topics</p>
      <h1>Browse by topic.</h1>
      <p class="intro">
        Each chip opens a Google search restricted to this site for that topic.
        Results depend on Google having indexed the article. New posts may take a few days to appear.
      </p>
      <form class="site-search" action="https://www.google.com/search" method="get" target="_blank"
        rel="noopener noreferrer">
        <label class="visually-hidden" for="topic-search">Search this site</label>
        <!-- Google advanced-search params: one query field + site restriction (no duplicate name="q"). -->
        <input id="topic-search" type="search" name="as_q" placeholder="Search akashplackal.com"
          autocomplete="off" enterkeyhint="search" />
        <input type="hidden" name="as_sitesearch" value="akashplackal.com" />
        <input type="hidden" name="as_dt" value="i" />
        <button type="submit">Search</button>
      </form>
    </header>

    <section aria-labelledby="all-topics-title">
      <h2 id="all-topics-title" class="visually-hidden"
        style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
        All topics</h2>
      <ul class="chips" aria-label="All topics">
        {{TOPICS_CHIPS}}
      </ul>
    </section>

  </main>

  <script src="/assets/nav-audio.js" defer></script>
