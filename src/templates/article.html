<!doctype html>
<html lang="en">

<head>
  <include src="src/partials/head-base.html"></include>
  <title>{{TITLE}} — Akash Plackal</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{CANONICAL}}" />
  {{OG_IMAGE_META}}
  {{ARTICLE_META}}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  {{HERO_PRELOAD}}
  <link rel="stylesheet" href="/src/styles/articles/base.css" data-inline />
  {{JSON_LD}}
</head>

<body>
  <div class="reading-progress" aria-hidden="true">
    <div class="reading-progress-indicator"></div>
    <div class="reading-progress-marker"></div>
  </div>

  <div class="article-shell">
    <main>
      <nav class="meta-row" aria-label="Article meta">
        <a class="back" href="/writing/" aria-label="Go back" data-back-link>&larr; Back</a>
        <div class="article-meta-actions">
          <time datetime="{{DATETIME}}">{{DATE}}</time>
          <button class="share-button" type="button" data-share aria-label="Share this article">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.6 6.8-4.2m-6.8 7 6.8 4.2"/></svg>
            <span data-share-label>Share</span>
          </button>
        </div>
      </nav>

      <h1>{{TITLE}}</h1>

      {{HERO}}

      <article>
        {{BODY}}
      </article>

      <p><a href="/writing/">Read more articles by Akash Plackal</a></p>
    </main>

    {{TOC}}
  </div>
  <script src="/assets/nav-audio.js" defer></script>
  <div class="giscus-wrap">
    <div class="giscus"></div>
  </div>
</body>

</html>
