<!doctype html>
<html lang="en">

<head>
  <include src="src/partials/head-base.html"></include>
  <title>{{TITLE}} — Akash Plackal</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{CANONICAL}}" />
  {{OG_IMAGE_META}}
  {{ARTICLE_META}}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  {{HERO_PRELOAD}}
  <link rel="stylesheet" href="/src/styles/articles/base.css" data-inline />
  {{JSON_LD}}
</head>

<body>
  <div class="reading-progress" aria-hidden="true">
    <div class="reading-progress-indicator"></div>
    <div class="reading-progress-marker"></div>
  </div>

  <div class="article-shell">
    <main>
      <nav class="meta-row" aria-label="Article meta">
        <a class="back" href="/writing/" aria-label="Go back" data-back-link>&larr; Back</a>
        <time datetime="{{DATETIME}}">{{DATE}}</time>
      </nav>

      <h1>{{TITLE}}</h1>

      {{HERO}}

      <article>
        {{BODY}}
      </article>

      <p><a href="/writing/">Read more articles by Akash Plackal</a></p>
    </main>

    {{TOC}}
  </div>
  <script src="/assets/nav-audio.js" defer></script>
  <div class="giscus-wrap">
    <div class="giscus"></div>
  </div>
</body>

</html>
